<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
    <style>
        body {
            width: 280px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 14px;
        }

        h3 {
            margin: 0 0 12px 0;
            color: #2ecc71;
            font-size: 13px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h3 img {
            width: 20px;
            height: 20px;
        }

        .section-title {
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
            margin: 12px 0 6px 0;
            font-weight: bold;
            letter-spacing: 0.03em;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #242424;
            padding: 8px 10px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .option-label {
            font-size: 12px;
        }

        .zip-input,
        .hospital-select {
            width: 100px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        .zip-input {
            width: 60px;
            text-align: center;
        }

        .zip-input:focus,
        .hospital-select:focus {
            border-color: #e74c3c;
            outline: none;
        }

        .btn-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            color: #fff;
            text-decoration: none;
            background: #2b2b2b;
            border-left: 3px solid #3498db;
            border-radius: 0 4px 4px 0;
            margin-bottom: 6px;
            font-size: 12px;
            transition: background 0.2s;
        }

        .btn-link:hover {
            background: #353535;
        }

        .btn-link i {
            font-size: 15px;
            flex-shrink: 0;
        }

        .btn-bces {
            border-left-color: #2ecc71;
        }

        .btn-bces i {
            color: #2ecc71;
        }

        .btn-lses {
            border-left-color: #3498db;
        }

        .btn-lses i {
            color: #3498db;
        }

        .btn-intra21 {
            border-left-color: #e67e22;
        }

        .btn-intra21 i {
            color: #e67e22;
        }

        .status-msg {
            font-size: 10px;
            color: #2ecc71;
            text-align: right;
            margin-top: -4px;
            margin-bottom: 4px;
            height: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .popup-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #333;
            font-size: 10px;
            color: #555;
        }

        /* ── Bannière d'épinglage ─────────────────────────────────────── */
        .pin-banner {
            background: rgba(243, 156, 18, 0.09);
            border: 1px solid rgba(243, 156, 18, 0.5);
            border-left: 3px solid #f39c12;
            border-radius: 0 4px 4px 0;
            padding: 10px 10px 10px 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .pin-banner-text {
            font-size: 11px;
            line-height: 1.4;
            color: #f5d6a3;
            padding-right: 18px;
            display: flex;
            align-items: flex-start;
            gap: 5px;
        }

        .pin-banner-text i {
            font-size: 13px;
            color: #f39c12;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .pin-banner-text strong {
            color: #f39c12;
        }

        .pin-banner-actions {
            display: flex;
            gap: 6px;
        }

        .pin-banner-btn {
            flex: 1;
            background: #f39c12;
            color: #1a1a1a;
            border: none;
            border-radius: 3px;
            padding: 5px 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        .pin-banner-btn:hover {
            background: #e67e22;
        }

        .pin-banner-close {
            position: absolute;
            top: 6px;
            right: 6px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: color 0.2s, background 0.2s;
        }

        .pin-banner-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>

    <h3 id="popupTitle">
        <img src="icons/icon32.png" alt="">
        <span id="popupTitleText">EMS Medical Extension</span>
    </h3>

    <div id="pinBanner" class="pin-banner" style="display: none;">
        <button id="pinBannerClose" class="pin-banner-close" title="Ne plus afficher">×</button>
        <div class="pin-banner-text">
            <i class="ti ti-pin" aria-hidden="true"></i>
            <span><strong>Épinglez l'extension</strong> à la barre d'outils pour y accéder plus rapidement !</span>
        </div>
        <div class="pin-banner-actions">
            <button id="pinBannerHelp" class="pin-banner-btn">Comment faire ?</button>
        </div>
    </div>

    <div class="section-title">Paramètres</div>

    <div class="option-item">
        <span class="option-label">Votre hôpital :</span>
        <select id="hospitalSelect" class="hospital-select">
            <option value="BCES">BCES</option>
            <option value="LSES">LSES</option>
        </select>
    </div>

    <div class="option-item">
        <span class="option-label">Code ZIP par défaut :</span>
        <input type="number" id="defaultZip" class="zip-input" placeholder="Ex: 9012">
    </div>
    <div id="status" class="status-msg">Sauvegardé !</div>

    <div class="section-title">Raccourcis Dispatches</div>

    <a id="linkBCES" href="#" target="_blank" class="btn-link btn-bces">
        <i class="ti ti-building-hospital" aria-hidden="true"></i>
        Dispatch BCES
    </a>
    <a id="linkLSES" href="#" target="_blank" class="btn-link btn-lses">
        <i class="ti ti-building-skyscraper" aria-hidden="true"></i>
        Dispatch LSES
    </a>
    <a id="linkIntra21" href="#" target="_blank" class="btn-link btn-intra21">
        <i class="ti ti-link" aria-hidden="true"></i>
        Intranet 21
    </a>

    <div id="popupFooter" class="popup-footer"></div>

    <script src="popup.js"></script>
</body>

</html>
